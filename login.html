<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My Modern School</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="school-icon">
                🏫
            </div>

            <h1>My Modern School</h1>

            <p class="subtitle">
                School Management System
            </p>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input
                            type="checkbox"
                            id="rememberMe"
                        >
                        Remember me
                    </label>

                    <a href="/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>

            </form>


            <div class="login-footer">

                <p>
                    Don't have an account?
                    <a href="/register.html">
                        Register
                    </a>
                </p>

                <a href="/">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
